<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday! 🎂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Confetti container -->
<div id="confetti"></div>

<div class="main-wrapper">
  <h1 class="birthday-title">
    <span class="title-text">Happy Birthday!</span> 
    <span class="title-emoji">💖🎂</span>
  </h1>

  <!-- Cake elements  -->
  <div class="cake-area">
    <div class="cake">
      <div class="plate"></div>
      <div class="layer layer-bottom"></div>
      <div class="layer layer-middle"></div>
      <div class="layer layer-top"></div>
      <div class="icing"></div>
      <div class="drip drip1"></div>
      <div class="drip drip2"></div>
      <div class="drip drip3"></div>
      <div class="candle">
          <div class="flame"></div>
          <div class="smoke"></div>
      </div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button id="lightCandleButton">จุดเทียน 🕯️</button>
    <button id="blowCandleButton">เป่าเค้ก 💨</button>
  </div>

  <!-- Display random thank you message -->
  <div id="thankYouMessage"></div>

  <!-- Name input & share link card -->
  <div class="name-control-card">
    <div class="name-input-row">
      <select id="prefixSelect" class="prefix-select" title="เลือกรูปแบบข้อความ">
        <option value="HAPPY DAY TO" selected>HAPPY DAY TO</option>
        <option value="HAPPY BIRTHDAY TO">HAPPY BIRTHDAY TO</option>
        <option value="HBD TO">HBD TO</option>
      </select>
      <input type="text" id="nameInput" placeholder="ใส่ชื่อเพื่อนตรงนี้..." maxlength="30" autocomplete="off">
      <button id="clearNameBtn" class="clear-btn" type="button" title="ล้างชื่อ" style="display: none;">✕</button>
    </div>
    <div class="btn-row">
      <button id="shareLinkBtn" class="share-btn" type="button">
        <span>คัดลอกลิงก์ส่งให้เพื่อน 🔗</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div id="copyToast" class="copy-toast">คัดลอกลิงก์แล้ว! 💌</div>

</body>
</html>
