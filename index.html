<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday! 🎂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ร่วมส่งความสุขและเป่าเค้กวันเกิดสุดพิเศษให้กับเพื่อนของคุณ 🎂✨">
  <meta name="theme-color" content="#ffd6e2">
  <meta property="og:title" content="Happy Birthday Celebration! 🎂">
  <meta property="og:description" content="มาร่วมอธิษฐานและเป่าเค้กวันเกิดสุดน่ารักไปด้วยกันนะ! 💖">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=1200&auto=format&fit=crop&q=80">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Happy Birthday Celebration! 🎂">
  <meta name="twitter:description" content="มาร่วมอธิษฐานและเป่าเค้กวันเกิดสุดน่ารักไปด้วยกันนะ! 💖">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=1200&auto=format&fit=crop&q=80">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

<!-- Confetti container -->
<div id="confetti" aria-hidden="true"></div>

<!-- Step 1: Name Entry Screen -->
<div id="nameScreen" class="name-screen">
  <div class="name-card">
    <div class="card-icon" aria-hidden="true">🎂</div>
    <h2 class="card-title">วันเกิดของใครเอ่ย? ✨</h2>
    <p class="card-subtitle">กรอกชื่อเจ้าของวันเกิด เพื่อเริ่มงานฉลองสุดพิเศษ 🎉</p>
    
    <div class="input-wrapper">
      <label for="nameInput" class="sr-only">กรอกชื่อเจ้าของวันเกิด</label>
      <input type="text" id="nameInput" placeholder="พิมพ์ชื่อตรงนี้..." maxlength="30" autocomplete="off" autofocus>
    </div>
    <div id="inputError" class="input-error" role="alert" aria-live="polite">กรุณากรอกชื่อก่อนน้า 💖</div>
    
    <button id="submitNameBtn" class="btn-next" type="button" aria-label="ไปยังหน้าเค้กวันเกิด">
      <span>ถัดไป ➔</span>
    </button>
  </div>
</div>

<!-- Step 2: Birthday Celebration Screen -->
<div class="main-wrapper" id="birthdayScreen" style="display: none;" tabindex="-1">
  <h1 class="birthday-title">
    <span class="title-text">HAPPY DAY TO ...</span> 
    <span class="title-emoji" aria-hidden="true">💖🎂</span>
  </h1>

  <!-- Cake elements  -->
  <div class="cake-area" aria-label="เค้กวันเกิด">
    <div class="cake">
      <div class="plate"></div>
      <div class="layer layer-bottom"></div>
      <div class="layer layer-middle"></div>
      <div class="layer layer-top"></div>
      <div class="icing"></div>
      <div class="drip drip1"></div>
      <div class="drip drip2"></div>
      <div class="drip drip3"></div>
      <div class="candle">
          <div class="flame" aria-hidden="true"></div>
          <div class="smoke" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button id="lightCandleButton" aria-label="จุดเทียนบนเค้ก">จุดเทียน 🕯️</button>
    <button id="blowCandleButton" aria-label="เป่าเทียนเค้กวันเกิด">เป่าเค้ก 💨</button>
  </div>

  <!-- Display random thank you message -->
  <div id="thankYouMessage" role="status" aria-live="polite"></div>

  <!-- Secondary actions -->
  <div class="secondary-actions">
    <button id="changeNameBtn" class="change-name-btn" type="button" aria-label="กลับไปแก้ไขชื่อเจ้าของวันเกิด" title="กลับไปเปลี่ยนชื่อ">✏️ เปลี่ยนชื่อ</button>
    <button id="copyShareBtn" class="copy-link-btn" type="button" aria-label="คัดลอกลิงก์วันเกิดนี้ไปให้เพื่อน" title="คัดลอกลิงก์ส่งให้เพื่อน">🔗 คัดลอกลิงก์</button>
  </div>
</div>

<!-- Toast notification -->
<div id="copyToast" class="copy-toast" role="status" aria-live="polite">คัดลอกลิงก์แล้ว! 💌</div>

</body>
</html>
