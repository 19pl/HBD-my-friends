<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday! 🎂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Confetti container -->
<div id="confetti"></div>

<!-- Step 1: Name Entry Screen -->
<div id="nameScreen" class="name-screen">
  <div class="name-card">
    <div class="card-icon">🎂</div>
    <h2 class="card-title">วันเกิดของใครเอ่ย? ✨</h2>
    <p class="card-subtitle">กรอกชื่อเจ้าของวันเกิด เพื่อเริ่มงานฉลองสุดพิเศษ 🎉</p>
    
    <div class="input-wrapper">
      <input type="text" id="nameInput" placeholder="พิมพ์ชื่อตรงนี้..." maxlength="30" autocomplete="off" autofocus>
    </div>
    <div id="inputError" class="input-error">กรุณากรอกชื่อก่อนน้า 💖</div>
    
    <button id="submitNameBtn" class="btn-next" type="button">
      <span>ถัดไป ➔</span>
    </button>
  </div>
</div>

<!-- Step 2: Birthday Celebration Screen -->
<div class="main-wrapper" id="birthdayScreen" style="display: none;">
  <h1 class="birthday-title">
    <span class="title-text">HAPPY DAY TO ...</span> 
    <span class="title-emoji">💖🎂</span>
  </h1>

  <!-- Cake elements  -->
  <div class="cake-area">
    <div class="cake">
      <div class="plate"></div>
      <div class="layer layer-bottom"></div>
      <div class="layer layer-middle"></div>
      <div class="layer layer-top"></div>
      <div class="icing"></div>
      <div class="drip drip1"></div>
      <div class="drip drip2"></div>
      <div class="drip drip3"></div>
      <div class="candle">
          <div class="flame"></div>
          <div class="smoke"></div>
      </div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button id="lightCandleButton">จุดเทียน 🕯️</button>
    <button id="blowCandleButton">เป่าเค้ก 💨</button>
  </div>

  <!-- Display random thank you message -->
  <div id="thankYouMessage"></div>

  <!-- Change name button -->
  <button id="changeNameBtn" class="change-name-btn" type="button">✏️ เปลี่ยนชื่อ</button>
</div>

</body>
</html>
